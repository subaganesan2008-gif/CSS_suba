<!DOCTYPE>
<html>
    <head>
        <style>
            .container{
                display: grid;
                grid-template-columns: auto auto auto;
                background-color: blueviolet;
                padding: 10px;
            }
            .container div{
                background-color :darkgoldenrod;
border: 1px solid black;
padding: 10px;
font_size:30px;
text-align:center;
            }
        </style>
        
    </head>
    <body>
        <h1>Grid Layout</h1>
        <p>A grid layout with 5 containers</p>
        <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div> 
    <div>5</div>
       </div>
        </body>
</html>
