<!DOCTYPE>
<html>
    <head>
        <style>
            div{
                border:1px solid black;
                margin-top:100px;
                margin-bottom: 100px;
                margin-right: 150px;
                margin-left: 150px;
                background-color: lightblue;
                width:500px;
                margin: auto;
                
            }
            </style>
    </head>
    <body>
        <div>
            <h1>Using individual margin properties</h1>
            this div element has an top margin of 100px,has an bottom of 100px,has an left margin of 80px,has an right margin of 150px   
        </div>
        </body>
</html>
