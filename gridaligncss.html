<!DOCTYPE>
<html>
    <head>
        <style>
      .container{
        display.grid;
        grid-template-columns: auto auto auto;
        gap: 5px;
        background-color: rgb(27, 39, 110);
        padding: 50px;
      }      
      .container div{
        background-color: antiquewhite;
        text-align: center;
        padding: 60px;
        font-size: 20px;
        border: 1px solid black;
      }
      .item1{
        grid-column-start: 1;
        grid-row-start: 3;
      }
        </style>
    </head>
    <body>
        <h1>grid column start and grid column end properties</h1>
        <div class="container">
            <div class="item1">1</div>
            <div class="item2">2</div>
            <div class="item3">3</div>
            <div class="item4">4</div>
            <div class="item5">5</div>
        </div>
    </body>
</html>
